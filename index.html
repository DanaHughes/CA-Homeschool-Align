<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Homeschool Work Sample Pro</title>
    
    <!-- App-like Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HWSP">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#e7b64f">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>

        /* Work sample pages (always white paper with dark ink, on screen and in print) */
        .ws-page { background:#fff; color:#1f2937; font-family:'Patrick Hand','Comic Sans MS',system-ui,sans-serif; font-size:15px; line-height:1.3; border-radius:6px; box-shadow:0 8px 30px -10px rgba(0,0,0,.35); padding:24px 24px 16px; display:flex; flex-direction:column; gap:7px; width:100%; max-width:680px; margin:0 auto 20px; min-height:880px; }
        .ws-field { display:flex; gap:6px; align-items:baseline; }
        .ws-input { flex:1; min-width:0; border:0; border-bottom:1px solid #1f2937; background:transparent; font:inherit; color:inherit; padding:0 4px; border-radius:0; outline-offset:2px; }
        .ws-auto { background:rgba(253,220,150,.45); }
        .ws-how { resize:none; height:4.9em; }
        .ws-pic { border:1.5px solid #1f2937; border-radius:3px; background:#fafafa; overflow:hidden; }
        .ws-write { width:100%; flex:1; min-height:8em; resize:none; border:0; background-color:transparent; font:inherit; color:inherit; padding:0; outline-offset:2px; line-height:2.1em; background-attachment:local; background-image:linear-gradient(to bottom, transparent calc(100% - 1px), #9aa3af 0); background-size:100% 2.1em; background-repeat:repeat-y; }
        .ws-write.primary { line-height:2.4em; background-image:linear-gradient(to bottom, transparent calc(100% - 1px), #9aa3af 0), linear-gradient(to bottom, transparent calc(100% - 1px), #cbd2da 0); background-size:100% 2.4em, 100% 1.2em; background-repeat:repeat-y; }
        .ws-guide { border:1.5px dashed #1f2937; border-radius:6px; padding:6px 10px; font-size:.92em; }
        .ws-guide-title { font-size:.85em; letter-spacing:.12em; text-transform:uppercase; color:#4b5563; }
        .ws-foot { text-align:center; font-size:.85em; color:#6b7280; padding-top:4px; }
        .ws-org { display:grid; grid-template-columns:1.15fr 44px 1fr; grid-template-rows:repeat(3, minmax(88px,1fr)); gap:8px 4px; flex:1; min-height:340px; }
        .ws-org-center { grid-row:1 / 4; grid-column:1; border:1.5px solid #1f2937; border-radius:3px; overflow:hidden; display:flex; flex-direction:column; }
        .ws-org-cap { text-align:center; font-size:1.15em; padding:4px; border-top:1.5px solid #1f2937; background:#fff; }
        .ws-org-arrow { grid-column:2; display:grid; place-items:center; }
        .ws-org-box { grid-column:3; border:1.5px solid #1f2937; border-radius:3px; display:flex; flex-direction:column; min-height:0; }
        .ws-org-box label { font-size:.9em; padding:3px 6px 0; }
        .ws-org-box textarea { flex:1; width:100%; resize:none; padding:2px 6px; border:0; background:transparent; font:inherit; color:inherit; line-height:1.3; }
        @media print {
            .ws-card { padding:0 !important; box-shadow:none !important; border:0 !important; background:transparent !important; border-radius:0 !important; }
            .ws-page { box-shadow:none; border-radius:0; margin:0; max-width:none; min-height:0; height:10in; page-break-after:always; break-after:page; overflow:hidden; }
            .ws-auto { background:transparent !important; }
        }

        /* Base print logic */
        .print-only { display: none !important; }
        
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            
            @page { 
                margin: 0.5in; 
                size: portrait;
            }
            
            body { 
                background-color: white !important; 
                color: black !important; 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact;
                margin: 0 !important;
                padding: 0 !important;
                font-family: serif; 
            }
            
            #root, main {
                max-width: none !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .official-header {
                text-align: center;
                border-bottom: 2pt solid #81adb3;
                padding-bottom: 15pt;
                margin-bottom: 20pt;
                display: flex !important;
                flex-direction: column;
                align-items: center;
            }

            /* Ensure transcript table looks professional */
            .transcript-container {
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
            }

            .record-row {
                page-break-inside: avoid;
                border-top: 1px solid #e2e8f0 !important;
                padding: 15pt 0 !important;
                display: grid !important;
                grid-template-cols: 100pt 1fr 2fr !important;
                gap: 20pt !important;
            }

            .match-logic-box {
                background-color: #f8fafc !important;
                border: 1px solid #e2e8f0 !important;
                padding: 10pt !important;
                margin-top: 10pt !important;
                font-style: italic !important;
            }
            
            h3 { font-size: 24pt !important; margin-bottom: 5pt !important; }
            .standard-code { background-color: #334155 !important; color: white !important; padding: 2pt 5pt !important; border-radius: 3pt !important; }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bg-blob {
            position: fixed;
            width: 50vw;
            height: 50vw;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.4.1",
    "vite": "https://aistudiocdn.com/vite@^7.2.2",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "firebase/": "https://esm.sh/firebase@^12.7.0/",
    "jspdf": "https://esm.sh/jspdf@^3.0.4"
  }
}
</script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen selection:bg-[#81adb3]/20">
    <!-- Decorative Blobs -->
    <div class="bg-blob bg-[#81adb3] top-1/2 left-1/4"></div>
    <div class="bg-blob bg-[#e7b64f] -top-20 -left-20"></div>
    <div class="bg-blob bg-[#f4989c] -bottom-20 -right-20"></div>
    
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
